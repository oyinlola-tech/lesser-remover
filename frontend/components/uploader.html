<section class="uploader">
  <div class="drop-zone" id="drop-zone">
    <div class="upload-icon">↑</div>
    <h2>Drop an image here</h2>
    <p>Or choose an image from your computer</p>
    <label for="file-input" class="primary-button"> Choose image </label>
    <input id="file-input" type="file" accept="image/*" class="visually-hidden" />
    <p class="file-hint">JPG, JPEG, PNG, WebP and other common image formats</p>
  </div>
  <div class="processing hidden" id="processing">
    <div class="processing-content">
      <div class="spinner"></div>
      <h2>Removing the background</h2>
      <p>
        Your image is being processed locally. This may take a moment for large
        images.
      </p>
    </div>
  </div>
  <div class="result-card hidden" id="result">
    <div class="result-header">
      <div>
        <h2 class="result-title">Your image is ready</h2>
        <div class="result-meta" id="result-meta"></div>
      </div>
      <button type="button" class="secondary-button" id="new-image-button">
        Process another
      </button>
    </div>
    <div class="preview">
      <img id="preview-image" alt="Background removed preview" />
    </div>
    <div class="variant-grid" id="variant-grid"></div>
  </div>
  <div class="error-message hidden" id="error-message"></div>
</section>

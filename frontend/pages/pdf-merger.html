  <body>
    <div id="site-header"></div>
    <main class="tool-page">
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <span class="eyebrow">PDF tool</span>
            <h1>Combine PDFs into one file.</h1>
            <p class="hero-description">Merge multiple PDFs into a single document. Upload order is preserved.</p>
          </div>
          <section class="tool-card">
            <div id="tool-unavailable" class="hidden" role="alert"></div>
            
            <div id="tool-upload" data-accept=".pdf,application/pdf" data-multiple="true" data-max-files="10" data-hint="Up to 10 PDF files, 50 MB each"></div>

<p class="file-hint">Files are merged in the order they are added.</p>
        
            </div>
            <button type="button" class="primary-button tool-run" id="tool-run">Merge PDFs</button>
            <div id="tool-processing"></div>
            <div id="tool-results"></div>
            <div id="tool-error"></div>
          </section>
        </div>
      </section>
